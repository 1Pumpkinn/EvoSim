name: EvoSim
version: '${version}'
main: dev.pumpkin.evosim.EvoSimPlugin
api-version: '26.2'
description: Real-time evolution simulation with natural selection.

commands:
  evo:
    description: Control the evolution simulation
    usage: /evo <create|start|stop|reset|spawn|speed|color|stats|tp|remove|hud|reload>
    permission: evosim.admin

permissions:
  evosim.admin:
    description: Create and control the EvoSim simulation
    default: op
