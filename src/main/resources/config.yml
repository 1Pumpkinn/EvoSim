# EvoSim configuration. Restart (or /evo reload once commands exist) to apply.

simulation:
  # Run the simulation every N server ticks (1 = 20 updates/sec, smoothest mob motion).
  tick-interval: 1
  # Simulation speed multiplier. 2.0 = twice as fast as real time.
  time-scale: 1.0

dimension:
  # Build the arena in its own void world instead of at your position. The world is created
  # the first time you run /evo create, is never saved, stays at daytime with clear weather,
  # and only EvoSim can spawn mobs in it. /evo remove sends everyone back to the main world.
  # Set to false to build the arena wherever you stand, like before.
  enabled: true
  name: evosim
  # Height creatures stand at (the floor is the block below).
  origin-y: 64

arena:
  # Side length in blocks (square arena, 16-512). In the dimension it is built from 0, 0. Bigger arenas take a while to build:
  # 384 is about nine times the area of the old 128 default.
  size: 384
  wall-height: 3
  floor-block: GRASS_BLOCK
  wall-block: DEEPSLATE_BRICKS

population:
  initial: 150
  # Every creature is a real mob entity, so a high cap costs server performance.
  max: 1000
  # Energy a founder creature starts with.
  start-energy: 60
  # Two adults whose energy reaches this value look for each other and mate...
  reproduction-threshold: 120
  # ...and the child starts with this much energy, paid half by each parent.
  reproduction-cost: 50
  # Creatures die of old age after this many simulated seconds.
  max-age-seconds: 300
  # Newborns grow from 40% to full size over this long and cannot mate until then.
  maturity-seconds: 15
  # How long a pair stays together (hearts and hopping) before the child is born.
  mating-seconds: 2.5

food:
  spawn-per-second: 140.0
  max: 1600
  # Energy gained from one piece of food.
  energy: 30

# Energy drained per simulated second:
#   base + speed-cost * speed^2 + size-cost * size^3 + vision-cost * vision
energy:
  base-cost: 0.6
  speed-cost: 0.2
  size-cost: 1.5
  vision-cost: 0.04

evolution:
  # Chance that each trait mutates when a child is born.
  mutation-rate: 0.25
  # Mutation size as a fraction of the trait's full range (std. deviation).
  mutation-strength: 0.08
  # How narrow the starting gene pool is (0 = identical, 1 = full range).
  initial-spread: 0.3

biomes:
  # The arena is split into patches of grassland, forest, desert, tundra and swamp.
  # Forests grow more food but slow walking; deserts have little food and fierce thirst;
  # tundra burns extra energy; swamps slow walking but barely cause thirst.
  enabled: true
  # Average number of patches to scatter (each is one of the five biomes).
  regions: 14
  # Every /evo create picks its own patch count within regions +/- this share (0-0.9).
  region-variance: 0.5
  # How uneven the patches are (0-1). At 0 they are all about the same size; higher values
  # give maps where one biome sprawls across a huge area while another is a small pocket.
  size-variance: 0.8

water:
  # Ponds are placed in the arena floor. Creatures drink when they stand in one.
  # Up to 8 ponds form one ring; more than that gets an outer and an inner ring.
  ponds: 14
  pond-radius: 6.0
  # Hydration (0-100) lost per second, and gained per second while drinking.
  thirst-per-second: 1.2
  drink-per-second: 25
  # Creatures look for water below this hydration (and put it before mating below half of it).
  seek-below: 50
  # Energy lost per second while hydration is 0.
  dehydration-damage: 2.0

breeding:
  # After mating, every sheep rests before it looks for a mate again. A ram rests this many seconds.
  # Each ram's rest-time gene scales it (x0.5 to x1.5).
  male-rest-seconds: 25
  # Ewes have the same kind of cooldown after mating (no gene scales it).
  female-rest-seconds: 30

wellbeing:
  # Mood runs 0-100. Under this value a creature is depressed: slower, and it will not mate.
  depression-below: 25
  depressed-speed-factor: 0.5
  # Mood falls while hungry, thirsty or alone (nobody in sight), and when others die nearby.
  # It recovers otherwise, and eating and mating lift it.
  mood-drain-per-second: 1.0
  mood-recovery-per-second: 0.6
  # Mood lost by every creature within a few blocks of a death (double for a widowed partner).
  grief-mood-loss: 18

orientation:
  # Share of creatures that pair with their own sex. They pair up and show hearts like
  # any other pair, but no child is born. They have rainbow wool.
  same-sex-chance: 0.1

animation:
  # Floating bar above each sheep showing energy, water and mood.
  stat-bars: true
  # While mating, the mounting partner is drawn as a tilted sheep model (an item
  # display) instead of the flat sheep. Needs the resource pack in resourcepack/.
  # Set to false to keep the plain flat pose without the pack.
  tilted-mount: true
  # How long a dead sheep lies on its side before it disappears (0 = vanish instantly).
  corpse-seconds: 4.0
